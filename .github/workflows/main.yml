name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Bubblewrap Docker
        run: |
          cat > twa-manifest.json << 'EOF'
          {
            "packageId": "com.nevahtovyj.app",
            "host": "nevahtovyj.netlify.app",
            "name": "Путь к себе",
            "launcherName": "Путь к себе",
            "display": "standalone",
            "themeColor": "#1c1a17",
            "themeColorDark": "#1c1a17",
            "navigationColor": "#1c1a17",
            "navigationColorDark": "#1c1a17",
            "navigationDividerColor": "#1c1a17",
            "navigationDividerColorDark": "#1c1a17",
            "backgroundColor": "#1c1a17",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://nevahtovyj.netlify.app/icon-512.png",
            "maskableIconUrl": "https://nevahtovyj.netlify.app/icon-512-maskable.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./pwa.keystore",
              "alias": "pwa"
            },
            "appVersionCode": 1,
            "appVersion": "1.0.0",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://nevahtovyj.netlify.app/manifest.json",
            "fallbackType": "customtabs",
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "playBilling": { "enabled": false },
            "alphaDependencies": { "enabled": false },
            "features": {},
            "enableGooglePlayBilling": false
          }
          EOF

          keytool -genkeypair \
            -dname "CN=nevahtovyj, OU=nevahtovyj, O=nevahtovyj, L=Moscow, S=Moscow, C=RU" \
            -alias pwa -keypass android123 \
            -keystore ./pwa.keystore -storepass android123 \
            -validity 20000 -keyalg RSA -keysize 2048

          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD=android123 \
            -e BUBBLEWRAP_KEY_PASSWORD=android123 \
            ghcr.io/nickvdh/nickvdh:latest \
            bash -c "bubblewrap build --skipPwaValidation" 2>&1 || true

          echo "=== Files after docker ==="
          ls -la *.apk *.aab 2>/dev/null || echo "Docker build didnt produce APK"

      - name: Fallback - manual Gradle build
        if: ${{ !hashFiles('*.apk') }}
        run: |
          echo "Trying direct Gradle build..."
          
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          
          npm i -g @bubblewrap/cli
          
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << CFGEOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          CFGEOF
          
          yes "y" | bubblewrap build --skipPwaValidation 2>&1 || true
          
          if [ ! -f app-release-signed.apk ]; then
            echo "Trying with update first..."
            yes "y" | bubblewrap update --skipVersionUpgrade 2>&1 || true
            yes "y" | bubblewrap build --skipPwaValidation 2>&1 || true
          fi
          
          echo "=== Final files ==="
          ls -la *.apk *.aab 2>/dev/null || ls -la

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevahtovyj-apk
          path: "*.apk"
          if-no-files-found: warn
          
      - name: Debug info
        if: always()
        run: |
          echo "=== All files ==="
          ls -la
          echo "=== Java ==="
          java -version 2>&1
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          ls $ANDROID_HOME 2>/dev/null || echo "no android home"
