name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: android123
      BUBBLEWRAP_KEY_PASSWORD: android123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap and generate project
        run: |
          npm i -g @bubblewrap/cli
          
          mkdir -p ~/.bubblewrap
          echo '{"jdkPath":"'$JAVA_HOME'","androidSdkPath":"/usr/local/lib/android/sdk"}' > ~/.bubblewrap/config.json
          
          keytool -genkeypair \
            -dname "CN=nevahtovyj, OU=nevahtovyj, O=nevahtovyj, L=Moscow, S=Moscow, C=RU" \
            -alias pwa -keypass android123 \
            -keystore ./pwa.keystore -storepass android123 \
            -validity 20000 -keyalg RSA -keysize 2048

          cat > twa-manifest.json << 'EOF'
          {
            "packageId": "com.nevahtovyj.app",
            "host": "nevahtovyj.netlify.app",
            "name": "Путь к себе",
            "launcherName": "Путь к себе",
            "display": "standalone",
            "themeColor": "#1c1a17",
            "themeColorDark": "#1c1a17",
            "navigationColor": "#1c1a17",
            "navigationColorDark": "#1c1a17",
            "navigationDividerColor": "#1c1a17",
            "navigationDividerColorDark": "#1c1a17",
            "backgroundColor": "#1c1a17",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://nevahtovyj.netlify.app/icon-512.png",
            "maskableIconUrl": "https://nevahtovyj.netlify.app/icon-512-maskable.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./pwa.keystore",
              "alias": "pwa"
            },
            "appVersionCode": 2,
            "appVersion": "1.0.1",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://nevahtovyj.netlify.app/manifest.json",
            "fallbackType": "customtabs",
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "playBilling": { "enabled": false },
            "alphaDependencies": { "enabled": false },
            "features": {},
            "enableGooglePlayBilling": false,
            "minSdkVersion": 19,
            "targetSdkVersion": 34
          }
          EOF

          yes "" | bubblewrap update --skipVersionUpgrade 2>&1 || true

      - name: Fix minSdk for compatibility
        run: |
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 19/' app/build.gradle || true
          
          if grep -q 'targetSdkVersion' app/build.gradle; then
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/' app/build.gradle
          fi

      - name: Build with Gradle
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          BT=/usr/local/lib/android/sdk/build-tools/36.1.0
          
          $BT/zipalign -f -v 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          
          $BT/apksigner sign \
            --ks ./pwa.keystore \
            --ks-key-alias pwa \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 19 \
            --out nevahtovyj.apk \
            aligned.apk
          
          $BT/apksigner verify --verbose --print-certs nevahtovyj.apk

      - name: Get fingerprint and create assetlinks
        run: |
          FINGERPRINT=$(keytool -list -v -keystore ./pwa.keystore -alias pwa -storepass android123 | grep SHA256 | awk '{print $NF}')
          echo "SHA-256: $FINGERPRINT"
          
          mkdir -p .well-known
          cat > .well-known/assetlinks.json << ALEOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.nevahtovyj.app",
              "sha256_cert_fingerprints": ["$FINGERPRINT"]
            }
          }]
          ALEOF
          
          echo "=== assetlinks.json ==="
          cat .well-known/assetlinks.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nevahtovyj-apk
          path: nevahtovyj.apk

      - name: Upload assetlinks
        uses: actions/upload-artifact@v4
        with:
          name: assetlinks
          path: .well-known/assetlinks.json
